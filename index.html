<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水墨文脉岛</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#f0ebe0;
    font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","Noto Serif SC",serif; }
  canvas { display:block; }
  #hud { position:fixed; top:0; left:0; right:0; z-index:5; pointer-events:none;
    display:flex; justify-content:space-between; align-items:flex-start; padding:22px 26px; }
  #title { font-family:"Noto Serif SC","Songti SC",serif; font-size:20px; font-weight:700;
    color:#3d5b68; letter-spacing:0.18em; }
  #sub { font-size:12px; color:#6f8b99; margin-top:6px; letter-spacing:0.1em; }
  #hint { font-size:12px; color:#6f8b99; letter-spacing:0.08em; margin-top:4px; }
  #hint .hint2 { margin-top:3px; opacity:0.82; }
  @media (max-width:600px){
    #hud { padding:16px 18px; }
    #title { font-size:16px; }
    #sub, #hint { font-size:11px; }
  }
  /* ===== 灯光切换 ===== */
  #light-btn { position:fixed; right:22px; bottom:22px; z-index:6; width:46px; height:46px;
    border-radius:50%; border:1px solid rgba(100,95,80,0.35); background:rgba(250,247,238,0.78);
    cursor:pointer; display:flex; align-items:center; justify-content:center; color:#5a5848;
    box-shadow:0 4px 14px rgba(90,80,60,0.16); backdrop-filter:blur(6px); transition:transform .15s ease; }
  #light-btn:hover { transform:scale(1.08); }
  #light-btn svg { width:22px; height:22px; }
  #light-panel { position:fixed; right:22px; bottom:80px; z-index:6; display:none;
    background:rgba(250,247,238,0.94); backdrop-filter:blur(8px); border-radius:14px; padding:8px;
    box-shadow:0 8px 24px rgba(90,80,60,0.18); border:1px solid rgba(120,110,90,0.22); }
  #light-panel.show { display:block; }
  .light-opt { display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:9px;
    cursor:pointer; font-size:13px; color:#5a5848; white-space:nowrap; }
  .light-opt:hover { background:rgba(168,168,150,0.18); }
  .light-opt .sw { width:18px; height:18px; border-radius:50%; border:1px solid rgba(0,0,0,0.08); }
  .light-opt.on { background:rgba(168,184,138,0.28); font-weight:600; }
  @media (max-width:600px){
    #light-btn { right:16px; bottom:16px; }
    #light-panel { right:16px; bottom:72px; }
  }
  /* ===== 声音按钮 ===== */
  #music-btn, #mute-btn { position:fixed; right:22px; z-index:6; width:46px; height:46px;
    border-radius:50%; border:1px solid rgba(100,95,80,0.35); background:rgba(250,247,238,0.78);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:#6a6a58; transition:all .3s ease; }
  #music-btn { bottom:78px; }
  #mute-btn { bottom:134px; }
  #music-btn.on { background:#e2e6d4; color:#3a4a42; box-shadow:0 4px 14px rgba(90,80,60,0.2); }
  #music-btn svg, #mute-btn svg { width:20px; height:20px; }
  #music-btn:hover, #mute-btn:hover { transform:scale(1.06); }
  @media (max-width:600px){
    #music-btn { right:16px; bottom:72px; }
    #mute-btn { right:16px; bottom:128px; }
  }
  /* ===== 提示 toast ===== */
  #toast { position:fixed; left:50%; top:16%; transform:translateX(-50%); z-index:8;
    background:rgba(250,247,238,0.92); color:#3a4a42; padding:10px 20px; border-radius:12px;
    font-size:14px; letter-spacing:0.1em; line-height:1.5; box-shadow:0 6px 18px rgba(90,80,60,0.18);
    border:1px solid rgba(120,110,90,0.16); opacity:0; transition:opacity .3s ease;
    pointer-events:none; white-space:normal; max-width:72vw; text-align:center; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<div id="hud">
  <div>
    <div id="title">水墨文脉岛</div>
    <div id="sub">一岛一世界 · 一墨一千年</div>
  </div>
  <div id="hint">
    <div>拖拽旋转 · 滚轮缩放</div>
    <div class="hint2">点一点，文脉会回应你</div>
  </div>
</div>

<button id="mute-btn" title="全部安静">
  <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>
<button id="music-btn" title="环境音">
  <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="18" cy="16" r="3" fill="currentColor"/></svg>
</button>
<button id="light-btn" title="灯光">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/>
    <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M18.9 5.1l-1.7 1.7M6.8 17.2l-1.7 1.7"/>
  </svg>
</button>
<div id="light-panel">
  <div class="light-opt" data-i="0"><span class="sw" style="background:#e6eeea"></span>晨雾</div>
  <div class="light-opt on" data-i="1"><span class="sw" style="background:#f0ebe0"></span>宣纸</div>
  <div class="light-opt" data-i="2"><span class="sw" style="background:#eccdb2"></span>霞照</div>
  <div class="light-opt" data-i="3"><span class="sw" style="background:#1e2b46"></span>月夜</div>
</div>

<div id="toast"></div>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<audio id="bg-dawn" src="assets/bg-dawn.wav" loop preload="auto"></audio>
<audio id="bg-noon" src="assets/bg-noon.wav" loop preload="auto"></audio>
<audio id="bg-dusk" src="assets/bg-dusk.wav" loop preload="auto"></audio>
<audio id="bg-night" src="assets/bg-night.wav" loop preload="auto"></audio>
<audio id="fx-guqin" src="assets/fx-guqin.wav" loop preload="auto"></audio>
<audio id="fx-silk" src="assets/fx-silk.wav" loop preload="auto"></audio>
<audio id="fx-bird" src="assets/fx-bird.wav" loop preload="auto"></audio>
<audio id="fx-pines" src="assets/fx-pines.wav" loop preload="auto"></audio>
<audio id="fx-petal" src="assets/fx-petal.wav" loop preload="auto"></audio>
<audio id="fx-lantern" src="assets/fx-lantern.wav" loop preload="auto"></audio>
<audio id="fx-pavilion" src="assets/fx-pavilion.wav" loop preload="auto"></audio>
<audio id="fx-water" src="assets/fx-water.wav" loop preload="auto"></audio>
<audio id="fx-stream" src="assets/fx-stream.wav" loop preload="auto"></audio>
<audio id="fx-breeze" src="assets/fx-breeze.wav" loop preload="auto"></audio>
<audio id="fx-stone" src="assets/fx-stone.wav" loop preload="auto"></audio>
<script>
(function(){
  'use strict';
  var T = THREE;

  /* ---------- 渲染器 ---------- */
  var renderer = new T.WebGLRenderer({ antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputEncoding = T.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  /* ---------- 场景与相机 ---------- */
  var scene = new T.Scene();
  scene.background = new T.Color(0xf0ebe0);
  scene.fog = new T.Fog(0xf0ebe0, 26, 70);

  var camera = new T.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 200);
  camera.position.set(7.6, 4.8, 8.8);
  camera.lookAt(0, 0.2, 0);

  var controls = new T.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.2, 0);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 4; controls.maxDistance = 18;
  controls.minPolarAngle = 0.4; controls.maxPolarAngle = 1.45;
  controls.maxAzimuthAngle = 2.2; controls.minAzimuthAngle = -2.2;

  /* ---------- 光照 ---------- */
  var sun = new T.DirectionalLight(0xfff4e0, 1.15);
  sun.position.set(6, 11, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
  sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
  sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  var hemi = new T.HemisphereLight(0xe2f4ff, 0x9ab8a6, 0.8);
  scene.add(hemi);
  var fill = new T.DirectionalLight(0xe9f4ff, 0.35);
  fill.position.set(-6, 4, -6);
  scene.add(fill);

  /* ---------- 星星（夜晚显示） ---------- */
  var starGeo = new T.BufferGeometry();
  var starN = 320;
  var starPos = new Float32Array(starN*3);
  for (var si=0; si<starN; si++){
    var sv = new T.Vector3(Math.random()*2-1, Math.random(), Math.random()*2-1);
    sv.normalize().multiplyScalar(32 + Math.random()*14);
    starPos[si*3] = sv.x; starPos[si*3+1] = sv.y; starPos[si*3+2] = sv.z;
  }
  starGeo.setAttribute('position', new T.BufferAttribute(starPos, 3));
  var starMat = new T.PointsMaterial({ color:0xffffff, size:0.18, transparent:true,
    opacity:0, sizeAttenuation:false });
  var stars = new T.Points(starGeo, starMat);
  scene.add(stars);

  /* ---------- 灯光预设与平滑过渡 ---------- */
  var LIGHT_PRESETS = [
    { name:'晨雾', sky:0xe6eeea, fog:0xe6eeea, sun:0xfff4e4, sunI:0.8,
      hemiSky:0xe6f0ea, hemiGround:0x9aa89a, fill:0xeef2ee, fillI:0.25, stars:0,
      hudTitle:0x6a7a72, hudSub:0x8a9a92 },
    { name:'宣纸', sky:0xf0ebe0, fog:0xf0ebe0, sun:0xfff1da, sunI:1.1,
      hemiSky:0xeef2ea, hemiGround:0xa8b098, fill:0xf2f0e6, fillI:0.3, stars:0,
      hudTitle:0x3a4a42, hudSub:0x6a7a72 },
    { name:'霞照', sky:0xeccdb2, fog:0xeccdb2, sun:0xffb26b, sunI:0.95,
      hemiSky:0xffd9c0, hemiGround:0xb08a70, fill:0xffbf92, fillI:0.28, stars:0.25,
      hudTitle:0x7a523a, hudSub:0xa08a6a },
    { name:'月夜', sky:0x1e2b46, fog:0x1e2b46, sun:0xaab6e0, sunI:0.5,
      hemiSky:0x35415f, hemiGround:0x1c2436, fill:0x2e3a5a, fillI:0.2, stars:1,
      hudTitle:0xd8e2ee, hudSub:0x9aa8c0 }
  ];
  var curC = { skyC:new T.Color(0xf0ebe0), fogC:new T.Color(0xf0ebe0),
    sunC:new T.Color(0xfff1da), hemiSkyC:new T.Color(0xeef2ea),
    hemiGroundC:new T.Color(0xa8b098), fillC:new T.Color(0xf2f0e6) };
  var tgtC = { skyC:curC.skyC.clone(), fogC:curC.fogC.clone(), sunC:curC.sunC.clone(),
    hemiSkyC:curC.hemiSkyC.clone(), hemiGroundC:curC.hemiGroundC.clone(),
    fillC:curC.fillC.clone() };
  var curI = { sun:1.1, fill:0.3, stars:0 };
  var tgtI = { sun:1.1, fill:0.3, stars:0 };
  var hudEls = {
    title: document.getElementById('title'),
    sub: document.getElementById('sub'),
    hint: document.getElementById('hint')
  };
  var curHud = { t:new T.Color(0x3a4a42), s:new T.Color(0x6a7a72) };
  var tgtHud = { t:curHud.t.clone(), s:curHud.s.clone() };
  var lightIdx = 1;
  function applyLight(i){
    lightIdx = i;
    if (audio.bgOn) setBgAudio(i);
    var p = LIGHT_PRESETS[i];
    tgtC.skyC.setHex(p.sky); tgtC.fogC.setHex(p.fog); tgtC.sunC.setHex(p.sun);
    tgtC.hemiSkyC.setHex(p.hemiSky); tgtC.hemiGroundC.setHex(p.hemiGround);
    tgtC.fillC.setHex(p.fill);
    tgtI.sun = p.sunI; tgtI.fill = p.fillI; tgtI.stars = p.stars;
    tgtHud.t.setHex(p.hudTitle); tgtHud.s.setHex(p.hudSub);
  }
  var lightPanel = document.getElementById('light-panel');
  document.getElementById('light-btn').addEventListener('click', function(){
    lightPanel.classList.toggle('show');
  });
  document.querySelectorAll('.light-opt').forEach(function(o){
    o.addEventListener('click', function(){
      var i = +o.getAttribute('data-i');
      applyLight(i);
      document.querySelectorAll('.light-opt').forEach(function(x){ x.classList.remove('on'); });
      o.classList.add('on');
      lightPanel.classList.remove('show');
    });
  });

  /* ---------- 材质 ---------- */
  function mat(color, rough, metal){
    return new T.MeshStandardMaterial({ color:color, roughness:rough!==undefined?rough:0.9, metalness:metal||0 });
  }
  var grassMat = mat(0x8a9e7c, 0.95);
  var grassSideMat = mat(0x75876c, 0.95);
  var rockMat = mat(0x6e6a64, 0.95);
  var soilMat = mat(0x8a7f6a, 0.95);
  var waterMat = new T.MeshPhongMaterial({ color:0x9fc3c0, transparent:true, opacity:0.82,
    shininess:40, specular:0xd2e4e0 });
  var foamMat = new T.MeshStandardMaterial({ color:0xffffff, transparent:true, opacity:0.55,
    roughness:1, metalness:0 });
  var cloudMat = new T.MeshStandardMaterial({ color:0xeae5da, transparent:true, opacity:0.9,
    roughness:1, metalness:0 });
  var deerMat = mat(0xf6f1e6, 0.9);
  var deerDarkMat = mat(0xcfc4ac, 0.9);

  /* ---------- 岛主体 ---------- */
  var island = new T.Group();

  // 草地圆盘（顶面）
  var grassTop = new T.Mesh(new T.CylinderGeometry(2.75, 2.85, 0.26, 48), grassMat);
  grassTop.position.y = 0.13;
  grassTop.receiveShadow = true; grassTop.castShadow = true;
  island.add(grassTop);
  grassTop.userData.interact = 'grass';
  // 草侧边一圈
  var grassSkirt = new T.Mesh(new T.CylinderGeometry(2.55, 2.75, 0.5, 40), grassSideMat);
  grassSkirt.position.y = -0.12;
  grassSkirt.receiveShadow = true;
  island.add(grassSkirt);
  grassSkirt.userData.interact = 'grass';
  // 土坡（草地到岩石的过渡）
  var soil = new T.Mesh(new T.CylinderGeometry(2.45, 2.6, 0.55, 36), soilMat);
  soil.position.y = -0.45;
  soil.receiveShadow = true;
  island.add(soil);
  soil.userData.interact = 'grass';
  // 倒锥岩石底座（从土坡向下收尖）
  var rockBase = new T.Mesh(new T.ConeGeometry(2.5, 2.9, 34), rockMat);
  rockBase.rotation.x = Math.PI; // 顶点朝下
  rockBase.position.y = -1.85;
  rockBase.castShadow = true; rockBase.receiveShadow = true;
  island.add(rockBase);
  rockBase.userData.interact = 'rock';
  // 岩石底端加一圈小碎石（让尖端不那么生硬）
  var tip = new T.Mesh(new T.SphereGeometry(0.28, 12, 8), rockMat);
  tip.scale.set(1, 0.5, 1);
  tip.position.y = -3.25;
  island.add(tip);
  tip.userData.interact = 'rock';

  /* ---------- 湖与瀑布 ---------- */
  var lakeY = 0.255;
  var lakeGroup = new T.Group();
  lakeGroup.position.set(-1.15, lakeY, 0.72);
  island.add(lakeGroup);
  // 湖底（深色）
  var lakeBed = new T.Mesh(new T.CircleGeometry(0.74, 30), mat(0x6f9fb0, 0.8));
  lakeBed.rotation.x = -Math.PI/2;
  lakeBed.position.set(0, -0.015, 0);
  lakeGroup.add(lakeBed);
  // 湖面
  var lakeSurface = new T.Mesh(new T.CircleGeometry(0.72, 30), waterMat);
  lakeSurface.rotation.x = -Math.PI/2;
  lakeSurface.position.set(0, 0, 0);
  lakeGroup.add(lakeSurface);
  lakeSurface.userData.interact = 'lake';
  // 沙滩（湖边缘浅色圆环）
  var sand = new T.Mesh(new T.TorusGeometry(0.74, 0.08, 8, 30), mat(0xe8d9b0, 0.95));
  sand.rotation.x = -Math.PI/2;
  sand.position.set(0, -0.005, 0);
  lakeGroup.add(sand);
  sand.userData.interact = 'sand';

  // 瀑布（从湖边垂下）
  var falls = new T.Mesh(new T.CylinderGeometry(0.13, 0.2, 1.5, 12),
    new T.MeshPhongMaterial({ color:0xcfe9f4, transparent:true, opacity:0.55, shininess:60 }));
  falls.position.set(-1.78, -0.52, 0.95);
  island.add(falls);
  falls.userData.interact = 'falls';
  // 瀑布底部水雾
  for (var fi=0; fi<3; fi++){
    var f = new T.Mesh(new T.SphereGeometry(0.26, 10, 8), foamMat);
    f.scale.set(1.7, 0.55, 1.3);
    f.position.set(-1.78 + (fi-1)*0.22, -1.32 + Math.random()*0.12, 0.95 + (fi-1)*0.12);
    island.add(f);
  }

  /* ---------- 岩石崖壁 ---------- */
  function boulder(x, z, s, ry, color){
    var b = new T.Mesh(new T.DodecahedronGeometry(0.34, 0), mat(color||0xa98d6f, 0.95));
    b.userData.interact = 'boulder';
    b.scale.set(s[0], s[1], s[2]);
    b.position.set(x, lakeY + 0.1 + s[1]*0.34*0.5, z);
    b.rotation.y = ry || 0;
    b.castShadow = true; b.receiveShadow = true;
    island.add(b);
    return b;
  }
  boulder(-1.5, 0.45, [1.3, 1.5, 1.1], 0.6);   // 瀑布旁大岩
  boulder(-2.05, 0.75, [0.9, 1.2, 0.9], -0.4); // 瀑布另一侧
  boulder(-1.85, 1.35, [0.7, 0.6, 0.8], 0.9);  // 湖边石
  boulder(-0.55, 1.15, [0.8, 0.9, 0.7], 2.1);  // 湖对岸石
  boulder(-2.4, -0.6, [1.0, 0.9, 0.9], 1.2, 0x9c7f5f); // 岛边
  boulder(2.0, -1.9, [0.9, 1.3, 1.0], -0.8, 0x9c7f5f);  // 岛边
  boulder(2.5, 0.4, [0.7, 0.8, 0.8], 0.3);

  /* ---------- 松柏 ---------- */
  var trees = [];
  function pine(x, z, s, tone){
    var g = new T.Group();
    g.userData.interact = 'pine';
    trees.push(g);
    var trunk = new T.Mesh(new T.CylinderGeometry(0.1*s, 0.14*s, 0.8*s, 8),
      mat(0x4a3f33, 0.95));
    trunk.position.y = 0.4*s; trunk.castShadow = true;
    g.add(trunk);
    var c1 = new T.Mesh(new T.ConeGeometry(0.62*s, 0.7*s, 7), mat(tone[0], 0.92));
    c1.position.y = 0.95*s; c1.castShadow = true; g.add(c1);
    var c2 = new T.Mesh(new T.ConeGeometry(0.46*s, 0.62*s, 7), mat(tone[1], 0.92));
    c2.position.y = 1.3*s; c2.castShadow = true; g.add(c2);
    var c3 = new T.Mesh(new T.ConeGeometry(0.28*s, 0.5*s, 7), mat(tone[2], 0.92));
    c3.position.y = 1.58*s; c3.castShadow = true; g.add(c3);
    g.position.set(x, lakeY, z);
    g.rotation.y = Math.random()*Math.PI*2;
    island.add(g);
    return g;
  }
  var inkPineA = [0x27382c, 0x30453a, 0x3a5246];
  var inkPineB = [0x2b3d31, 0x36503f, 0x42604d];
  var inkPineC = [0x22342a, 0x2b3d31, 0x36503f];
  var treeSpots = [];
  for (var ti=0; ti<11; ti++){
    var a = (ti/11)*Math.PI*2 + (Math.random()-0.5)*0.4;
    var r = 1.0 + Math.random()*1.5;
    var x = Math.cos(a)*r, z = Math.sin(a)*r;
    // 避开湖与瀑布区
    if (Math.abs(x+1.15) < 0.95 && Math.abs(z-0.72) < 0.95) continue;
    if (Math.abs(x-1.5) < 0.7 && Math.abs(z-0.6) < 0.7) continue; // 避亭台
    if (Math.abs(x+0.55) < 0.7 && Math.abs(z-1.95) < 0.7) continue;  // 避舞者
    treeSpots.push([x, z]);
    var s = 0.85 + Math.random()*0.55;
    pine(x, z, s, [inkPineA, inkPineB, inkPineC][Math.floor(Math.random()*3)]);
  }

  /* ---------- 花 ---------- */
  var flowerColors = [0xf2d0c8, 0xeec4bd, 0xe8b8b0, 0xf6e6e0, 0xf7ded6];
  for (var fl=0; fl<34; fl++){
    var fa = Math.random()*Math.PI*2;
    var fr = Math.random()*2.4;

  var raycaster = new T.Raycaster();
  var ndc = new T.Vector2();
  var downPos = null;
  renderer.domElement.addEventListener('pointerdown', function(e){
    downPos = [e.clientX, e.clientY];
  });
  renderer.domElement.addEventListener('pointerup', function(e){
    if (!downPos) return;
    var dx = e.clientX - downPos[0], dy = e.clientY - downPos[1];
    downPos = null;
    if (dx*dx + dy*dy > 49) return; // 判定为拖拽，不算点击
    var rect = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX-rect.left)/rect.width)*2-1, -((e.clientY-rect.top)/rect.height)*2+1);
    raycaster.setFromCamera(ndc, camera);
    var hits = raycaster.intersectObjects(scene.children, true);
    for (var i=0;i<hits.length;i++){
      var o = findInteract(hits[i].object);
      if (o){
        interact(o, hits[i].point.clone());
        return;
      }
    }
  });

  function fadeTo(el, targetVol, dur, done){
    var t0 = performance.now(), v0 = el.volume;
    function step(){
      var k = Math.min(1, (performance.now()-t0)/(dur*1000));
      el.volume = v0 + (targetVol-v0)*k;
      if (k < 1) requestAnimationFrame(step);
      else if (done) done();
    }
    requestAnimationFrame(step);
  }
  function setBgAudio(i){
    var el = document.getElementById(BG_AUDIO_IDS[i]);
    if (!el || el === curBgAudio) return;
    if (curBgAudio){
      fadeTo(curBgAudio, 0, 0.8, function(){ curBgAudio.pause(); });
    }
    el.volume = 0;
    var p = el.play();
    if (p && p.catch) p.catch(function(){});
    fadeTo(el, 0.8, 0.8);
    curBgAudio = el;
  }
  function stopBgAudio(){
    if (curBgAudio){
      var el = curBgAudio;
      fadeTo(el, 0, 0.6, function(){ el.pause(); });
      curBgAudio = null;
    }
  }

    return { on:false, el:el, start:function(){
      this.on = true;
      el.currentTime = 0;
      el.volume = 0;
      var p = el.play();
      if (p && p.catch) p.catch(function(){});
      fadeTo(el, 0.85, 0.5);
    }, stop:function(){
      this.on = false;
      fadeTo(el, 0, 0.4, function(){ el.pause(); });
    } };
  }
  audio.items.guqin    = makeItemAudio('fx-guqin');
  audio.items.silk     = makeItemAudio('fx-silk');
  audio.items.pines    = makeItemAudio('fx-pines');
  audio.items.petal    = makeItemAudio('fx-petal');
  audio.items.lantern  = makeItemAudio('fx-lantern');
  audio.items.pavilion = makeItemAudio('fx-pavilion');
  audio.items.water    = makeItemAudio('fx-water');
  audio.items.stream   = makeItemAudio('fx-stream');
  audio.items.breeze   = makeItemAudio('fx-breeze');
  audio.items.bird     = makeItemAudio('fx-bird');
  audio.items.stone    = makeItemAudio('fx-stone');
  function toggleItemSound(kind){
    var it = audio.items[kind];
    if (!it) return false;
    if (it.on){ it.stop(); return false; }
    it.start(); return true;
  }
  function stopAllSounds(){
    for (var k in audio.items){
      if (audio.items[k] && audio.items[k].on) audio.items[k].stop();
    }
    audio.bgOn = false;
    document.getElementById('music-btn').classList.remove('on');
    stopBgAudio();
  }
  document.getElementById('music-btn').addEventListener('click', function(){
    audio.bgOn = !audio.bgOn;
    this.classList.toggle('on', audio.bgOn);
    if (audio.bgOn) setBgAudio(lightIdx);
    else stopBgAudio();
  });
  document.getElementById('mute-btn').addEventListener('click', function(){
    stopAllSounds();
  });

  /* ---------- 动画 ---------- */
  var clock = new T.Clock();
  var motionOff = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t = 0;

  function animate(){
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    if (!motionOff){
      t += dt;
      island.rotation.y += dt * 0.16;
      // 鸟：绕岛盘旋 + 扇翅
      for (var i=0;i<birds.length;i++){
        var b = birds[i], p = birdParams[i];
        b.position.set(Math.cos(t*p.speed + p.phase)*p.R, p.y0 + Math.sin(t*0.6 + p.phase*2)*0.5, Math.sin(t*p.speed + p.phase)*p.R);
        b.rotation.y = -t*p.speed - p.phase + Math.PI/2;
        b.rotation.z = Math.sin(t*p.flap + p.phase)*0.35;
        b.userData.wingL.rotation.z = Math.sin(t*p.flap + p.phase)*0.7;
        b.userData.wingR.rotation.z = -Math.sin(t*p.flap + p.phase)*0.7;
      }
      // 云：绕岛公转
      for (var j=0;j<clouds.length;j++){
        var cl = clouds[j];
        cl.a += dt * cl.speed;
        cl.g.position.x = Math.cos(cl.a)*cl.R;
        cl.g.position.z = Math.sin(cl.a)*cl.R;
      }
    }
    // 生态反馈（交互驱动，motionOff 时也执行）
    // 涟漪扩散
    for (var ri=ripples.length-1; ri>=0; ri--){
      var rp = ripples[ri];
      rp.t += dt;
      var rs = 0.5 + rp.t*1.7;
      rp.m.scale.set(rs, rs, 1);
      rp.m.material.opacity = Math.max(0, 0.55 - rp.t*0.7);
      if (rp.t > 0.8){
        lakeGroup.remove(rp.m); rp.m.geometry.dispose(); rp.m.material.dispose();
        ripples.splice(ri,1);
      }
    }
    // 粒子
    for (var pi=particles.length-1; pi>=0; pi--){
      var pt = particles[pi];
      pt.t += dt;
      var v = pt.m.userData.v;
      v.y -= 1.7*dt;
      pt.m.position.addScaledVector(v, dt);
      pt.m.material.opacity = Math.max(0, 1 - pt.t/pt.dur);
      if (pt.t >= pt.dur){
        scene.remove(pt.m); pt.m.geometry.dispose(); pt.m.material.dispose();
        particles.splice(pi,1);
      }
    }
    // 弹跳：快升快落、峰值一闪而过，幅度小且钳制上限
    for (var bi=bounces.length-1; bi>=0; bi--){
      var bn = bounces[bi];
      bn.t += dt;
      var bk = bn.t / 0.4;
      if (bk >= 1){ bn.o.scale.copy(bn.base); bounces.splice(bi,1); }
      else {
        var env = Math.pow(Math.sin(Math.PI*bk), 1.7);
        var mult = 1 + (bn.s-1)*env;
        if (mult > 1.15) mult = 1.15; // 双保险：无论连续点多少次都不超过 1.15 倍
        bn.o.scale.copy(bn.base).multiplyScalar(mult);
      }
    }
    // 点彩花（草地点击长出，5s 后隐去）
    for (var fi2=dotFlowers.length-1; fi2>=0; fi2--){
      var df = dotFlowers[fi2];
      df.t += dt;
      if (df.t > 5){
        island.remove(df.g);
        df.g.traverse(function(c){ if (c.isMesh){ c.geometry.dispose(); c.material.dispose(); } });
        dotFlowers.splice(fi2,1);
      }
    }
    // 孔明灯：缓升 + 淡出
    for (var lf=lanternFlights.length-1; lf>=0; lf--){
      var fl = lanternFlights[lf];
      fl.t += dt;
      fl.g.position.y += dt * 0.85;
      fl.g.scale.multiplyScalar(1 + dt*0.06);
      fl.g.traverse(function(c){
        if (c.isMesh && c.material.transparent) c.material.opacity = Math.max(0, 1 - fl.t/4.5);
      });
      if (fl.t > 4.5){
        island.remove(fl.g);
        fl.g.traverse(function(c){ if (c.isMesh){ c.geometry.dispose(); c.material.dispose(); } });
        lanternFlights.splice(lf,1);
      }
    }
    // 人物衣袂轻扬
    for (var fi3=0; fi3<figures.length; fi3++){
      var fg = figures[fi3];
      var sway = Math.sin(t*1.6 + fi3*1.3) * 0.06;
      fg.userData.sleeveL.rotation.z += (sway - fg.userData.sleeveL.rotation.z) * 0.2;
      fg.userData.sleeveR.rotation.z += (-sway - fg.userData.sleeveR.rotation.z) * 0.2;
    }
    // 灯光平滑过渡（始终进行，motionOff 时也能完成切换）
    var lk = Math.min(1, dt*3.5);
    curC.skyC.lerp(tgtC.skyC, lk); curC.fogC.lerp(tgtC.fogC, lk);
    curC.sunC.lerp(tgtC.sunC, lk); curC.hemiSkyC.lerp(tgtC.hemiSkyC, lk);
    curC.hemiGroundC.lerp(tgtC.hemiGroundC, lk); curC.fillC.lerp(tgtC.fillC, lk);
    curI.sun += (tgtI.sun - curI.sun)*lk;
    curI.fill += (tgtI.fill - curI.fill)*lk;
    curI.stars += (tgtI.stars - curI.stars)*lk;
    curHud.t.lerp(tgtHud.t, lk); curHud.s.lerp(tgtHud.s, lk);
    scene.background.copy(curC.skyC);
    scene.fog.color.copy(curC.fogC);
    sun.color.copy(curC.sunC); sun.intensity = curI.sun;
    hemi.color.copy(curC.hemiSkyC); hemi.groundColor.copy(curC.hemiGroundC);
    fill.color.copy(curC.fillC); fill.intensity = curI.fill;
    starMat.opacity = curI.stars;
    moonMat.opacity = curI.stars * 0.95;
    hudEls.title.style.color = '#' + curHud.t.getHexString();
    hudEls.sub.style.color = '#' + curHud.s.getHexString();
    hudEls.hint.style.color = '#' + curHud.s.getHexString();
    controls.update();
    renderer.render(scene, camera);
  }
  renderer.render(scene, camera); // 首帧立即渲染
  animate();

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
